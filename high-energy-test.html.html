<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEW WORLD High Energy Voice Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;margin:0;background:#f6f7fb;color:#111827}
.wrap{max-width:680px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:22px;margin:0 0 6px}
p{font-size:13px;line-height:1.55;color:#6b7280}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:16px;margin:14px 0}
button{width:100%;min-height:56px;border:0;border-radius:16px;background:#111827;color:#fff;font-weight:900;font-size:16px;padding:12px 14px;text-align:left}
button:active{transform:scale(.985)}
.small{font-size:12px;color:#6b7280;margin-top:8px;line-height:1.5}
audio{width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>NEW WORLD 高テンション人声テスト</h1>
<p>前回よりテンションを一段上げ、速度も少しだけ速くしています。早送り感が出ない範囲です。</p>

<div class="card">
<button id="duoBtn">🇫🇷 Duolingo — 女声フランス語・高テンション</button>
<div class="small">BONJOURRRR! OUI! OUI! OUI! TRÈS BIEEEEN! BAGUETTE POWER! CROISSANT POWER! ... MAGNIFIQUE, PUTAIN!</div>
<audio id="duo" controls preload="metadata" src="https://resource2.heygen.ai/text_to_speech/32d1b7be6f454f61ac76d5803c28dec6/4b1de1582d2c477485ad2e0c2717f0ff/id=f06e1a62-9db3-4e88-8d15-94de0d7ac3a4.wav"></audio>
</div>

<div class="card">
<button id="engBtn">🗣️ 英会話 — 男声チンピラ・高テンション</button>
<div class="small">YO! LOOK AT THIS MOTHERFUCKER SPEAKING ENGLISH! ... ENGLISH MODE, BITCH! LET'S GO!</div>
<audio id="eng" controls preload="metadata" src="https://resource2.heygen.ai/text_to_speech/32d1b7be6f454f61ac76d5803c28dec6/0dd34c3eb79247238219eea35aeb58cd/id=a9dee879-90d1-4bee-a0d0-fdeae1c60245.wav"></audio>
</div>

<div class="card">
<button id="vicBtn">🏆 完全勝利 — プロレス実況テンション</button>
<div class="small">男実況 → 女ツッコミ「アホかぁ！やりすぎやろぉぉ！何してんねん、最高やんけ！」</div>
<audio id="vicm" controls preload="metadata" src="https://resource2.heygen.ai/text_to_speech/32d1b7be6f454f61ac76d5803c28dec6/06c816b952f14fa9b3a6c42aa151f731/id=88052343-93f9-4b68-bb4d-a71cd2afdd35.wav"></audio>
<audio id="vicf" controls preload="metadata" src="https://resource2.heygen.ai/text_to_speech/32d1b7be6f454f61ac76d5803c28dec6/79e05a1d6a81453a8c05e43cd4bc5960/id=d7a3a9de-5380-49ba-98a5-72a715f13dc2.wav"></audio>
</div>
</div>
<script>
const ids=['duo','eng','vicm','vicf'];
function stopAll(){ids.forEach(id=>{const a=document.getElementById(id);a.pause();a.currentTime=0;})}
document.getElementById('duoBtn').onclick=()=>{stopAll();document.getElementById('duo').play()};
document.getElementById('engBtn').onclick=()=>{stopAll();document.getElementById('eng').play()};
document.getElementById('vicBtn').onclick=()=>{
  stopAll();
  const m=document.getElementById('vicm');
  const f=document.getElementById('vicf');
  m.play();
  m.onended=()=>setTimeout(()=>f.play(),180);
};
</script>
</body>
</html>
