<script>
const keys=["duo", "eng", "bbc", "book", "sleep", "trash", "toilet", "table", "floor", "sink", "secret", "cleanBoss", "cleanHero", "vicM", "vicF"];
let ctx=null, gain=null, comp=null;
const sources={};

async function ensureBoost(){
  try{
    if(!ctx){
      const C=window.AudioContext||window.webkitAudioContext;
      ctx=new C();
      gain=ctx.createGain();
      gain.gain.value=1.55;
      comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-10;
      comp.knee.value=14;
      comp.ratio.value=6;
      comp.attack.value=.004;
      comp.release.value=.18;
      gain.connect(comp).connect(ctx.destination);
      for(const k of keys){
        const a=document.getElementById(k);
        const s=ctx.createMediaElementSource(a);
        s.connect(gain);
        sources[k]=s;
      }
    }
    if(ctx.state==="suspended")await ctx.resume();
    document.getElementById("info").textContent="🔊 音量ブースト ON（約1.5倍＋クリップ防止）";
  }catch(e){
    document.getElementById("info").textContent="🔊 iPhone標準音量で再生（ブースト非対応）";
  }
}
function stopAll(){
  for(const k of keys){const a=document.getElementById(k);a.pause();a.currentTime=0;a.onended=null;}
}
async function playOne(k){
  stopAll();await ensureBoost();const a=document.getElementById(k);a.currentTime=0;await a.play();
}
async function playSeq(a,b,delay=170){
  stopAll();await ensureBoost();const x=document.getElementById(a),y=document.getElementById(b);
  x.currentTime=0;y.currentTime=0;
  x.onended=()=>setTimeout(()=>y.play(),delay);
  await x.play();
}
document.querySelectorAll("button[data-id]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const id=btn.dataset.id;
    if(id==="clean")return playSeq("cleanBoss","cleanHero",180);
    if(id==="victory")return playSeq("vicM","vicF",180);
    return playOne(id);
  });
});
document.getElementById("stop").onclick=stopAll;
</script>
